name: Build Free Client JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Find project (unzip phone upload if needed)
        run: |
          if [ -f free-client-source.zip ]; then
            unzip -o -q free-client-source.zip -d _src
            echo "PROJECT=_src/free-client" >> "$GITHUB_ENV"
          elif [ -f build.gradle ]; then
            echo "PROJECT=." >> "$GITHUB_ENV"
          else
            echo "No free-client-source.zip or build.gradle found in the repository root."
            exit 1
          fi

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        working-directory: ${{ env.PROJECT }}
        run: gradle build --no-daemon --stacktrace

      - name: Rename JAR
        run: |
          mkdir -p out
          JAR=$(find "${{ env.PROJECT }}/build/libs" -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$JAR" ]; then echo "Build finished but no JAR was produced."; exit 1; fi
          cp "$JAR" out/free-client0.1Beta.jar
          ls -l out

      - name: Save JAR as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-client0.1Beta
          path: out/free-client0.1Beta.jar

      - name: Publish JAR to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-beta
          name: Free Client 0.1 Beta
          prerelease: true
          files: out/free-client0.1Beta.jar
